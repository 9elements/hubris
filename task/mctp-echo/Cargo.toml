[package]
name = "mctp-echo"
version = "0.1.0"
edition = "2021"

[dependencies]
userlib = { path = "../../sys/userlib", features = ["panic-messages"] }
mctp-api = { path = "../mctp-api" }
mctp = { version = "0.2.0", default-features = false }
aspeed-ddk = { git = "https://github.com/AspeedTech-BMC/aspeed-rust.git" }
ast1060-pac = { git = "https://github.com/AspeedTech-BMC/ast1060-pac.git", features = ["rt"] }
cortex-m.workspace = true
embedded-hal = "1"
embedded-io = "0.6.1"

# This section is here to discourage RLS/rust-analyzer from doing test builds,
# since test builds don't work for cross compilation.
[[bin]]
name = "mctp-echo"
test = false
doctest = false
bench = false

[lints]
workspace = true
